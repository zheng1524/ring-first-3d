[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-first-3d-harness"
version = "0.1.0"
description = "SHA-locked adapters and engineering validation for Ring-First 3D research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.15,<2", "opencv-python>=4.11,<5", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ring_first_3d = ["source_lock.json"]
