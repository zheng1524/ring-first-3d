<!doctype html><meta charset="utf-8"><title>G01 native HERO / shared Body</title><style>body{margin:0;background:#ddd;font:13px sans-serif}#ui{position:absolute;left:8px;top:8px;background:#fffe;padding:8px;max-height:90vh;overflow:auto;z-index:2}canvas{display:block}</style><div id="ui"><b>G01 | Ring-First metric coordinates</b><p>Independent raw/corrected layers; no fusion. Root units: metres.</p><div id="layers">Loading local GLB…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0xeeeeee);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.00001,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const ctl=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2));new GLTFLoader().load("../local_results/G01_LAYERS.glb",g=>{scene.add(g.scene);const box=new THREE.Box3().setFromObject(g.scene),center=box.getCenter(new THREE.Vector3()),r=box.getSize(new THREE.Vector3()).length();camera.position.copy(center).add(new THREE.Vector3(r,-r,r*.65));ctl.target.copy(center);document.querySelector('#layers').textContent='';g.scene.traverse(o=>{if(!o.isMesh)return;o.material.side=THREE.DoubleSide;o.visible=o.name==='Ring_CAD'||o.name==='Body_B3'||o.name==='Inferred_CAP_B3'||o.name.startsWith('HERO_B3__');const label=document.createElement('label'),ck=document.createElement('input');ck.type='checkbox';ck.checked=o.visible;ck.onchange=()=>o.visible=ck.checked;label.append(ck,document.createTextNode(o.name));document.querySelector('#layers').append(label,document.createElement('br'));});document.body.dataset.loaded='true';},undefined,e=>document.querySelector('#layers').textContent='Load failed: '+e);function render(){requestAnimationFrame(render);ctl.update();renderer.render(scene,camera)}render();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};</script>
