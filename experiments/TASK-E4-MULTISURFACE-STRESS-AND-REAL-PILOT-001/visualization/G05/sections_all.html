<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>全部实验真实Mesh切面</title><style>body{font:15px system-ui;margin:22px;background:#f5f7fa;color:#152238}canvas{width:100%;max-width:2000px;background:white}select{padding:8px;max-width:95%}pre{white-space:pre-wrap}a{color:#235bb0}</style><h1>全部4个冻结结果：真实三角面切面</h1><p>全部3片源Mesh，真实组无独立GT；灰虚线Body、红004、蓝005、紫最终表面、浅紫虚线补全、不提供GT误差认证。四列：原始分散→Body视频级粗定位→分层/所选方法→最终统一主面；两纵向、两横向，固定毫米坐标。</p><select id="case"></select><label><input id="v004" type="checkbox" checked>004全部曲面</label><label><input id="v005" type="checkbox" checked>005全部曲面</label><canvas id="cuts" width="2000" height="2100"></canvas><pre id="details"></pre><p><a href="index.html">首页/第一张主图</a> · <a href="METRICS.json">全顶点材料误差</a> · <a href="FAILURE_LEDGER.json">逐帧失败</a> · <a href="METRICS.json">固定分母整体评价</a></p><script src="sections_shared.js"></script><script>const S=CUT_SHARED,sel=document.querySelector('#case'),can=document.querySelector('#cuts'),ctx=can.getContext('2d');S.keys.forEach(k=>sel.add(new Option(k,k)));const initial=decodeURIComponent(location.hash.slice(1));sel.value=S.keys.includes(initial)?initial:'REAL__E1__BODY_HIER__tol0.5';

ctx.fillStyle='#172334';ctx.font='16px system-ui';ctx.fillText(titles[col],x,y-30);ctx.font='13px system-ui';ctx.fillText('XYZ'[spec.axis]+'='+spec.offset_mm+' mm | actual triangle cuts',x,y-9);ctx.strokeStyle='#d8dce2';ctx.lineWidth=.5;ctx.setLineDash([]);for(let t=-15;t<=10;t+=5){if(t>=xmin&&t<=xmax){let a=P([t,ymin]),b=P([t,ymax]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.fillText(t,a[0]-7,a[1]+18)}if(t>=ymin&&t<=ymax){let a=P([xmin,t]),b=P([xmax,t]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.fillText(t,a[0]-28,a[1]+4)}}
